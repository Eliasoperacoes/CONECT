apply plugin: 'com.android.application'

android {
    namespace = "br.com.malachiasautopecas.conecta"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.com.malachiasautopecas.conecta"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            // E o próprio APK do site (public/conecta.apk): sem isto cada versão nova
            // levaria a anterior inteira dentro de si, sem usar
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.apk'
        }
    }
    /*
     * A CHAVE DO CONECTA (14/10/2026). Até o 1.2 o APK saía assinado com a
     * chave de depuração automática de um computador só — perdida ela, nenhum
     * APK futuro atualizaria o que está instalado. A chave de produção mora
     * em ~/ConectaChave, com cópia fora da máquina, e a senha só no arquivo
     * local `assinatura.properties` (o git o ignora). Sem ele o build de
     * produção PARA, em vez de assinar com outra chave sem ninguém ver.
     */
    def arquivoDaAssinatura = rootProject.file('assinatura.properties')
    def assinatura = new Properties()
    if (arquivoDaAssinatura.exists()) {
        arquivoDaAssinatura.withInputStream { assinatura.load(it) }
    }
    signingConfigs {
        release {
            if (arquivoDaAssinatura.exists()) {
                storeFile file(assinatura['storeFile'])
                storePassword assinatura['storePassword']
                keyAlias assinatura['keyAlias']
                keyPassword assinatura['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

// O APK de produção sem a chave do CONECTA não sai
gradle.taskGraph.whenReady { grafo ->
    if (grafo.allTasks.any { it.name.toLowerCase().contains('release') } && !rootProject.file('assinatura.properties').exists()) {
        throw new GradleException('Falta android/assinatura.properties (a chave do CONECTA, em ~/ConectaChave). O APK de produção não é assinado com outra chave.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // O aviso com "Responder" (ServicoDeAvisos, RespostaRapida) usa as
    // classes do Firebase direto. O plugin de push as traz, mas só para
    // ele — sem esta linha o app não compila. A versão vem de
    // variables.gradle, a mesma que o plugin lê: uma versão, um lugar.
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation project(':capacitor-push-notifications')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
