<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!--
    O losango da Malachias, redesenhado a partir da marca enviada pelo
    Elias. Um arquivo só: é a foto padrão de quem não tem foto, a tela de
    espera do sistema e a abertura do aplicativo Android.

    As listras correm paralelas à borda de cima-esquerda (x + y = constante),
    começando AZUL rente à borda: azul, preto, azul, preto, azul. O "M"
    branco fica por cima e as deixa à mostra só no "V" e à esquerda.
  -->
  <defs>
    <clipPath id="losango">
      <polygon points="250,10 490,250 250,490 10,250" />
    </clipPath>
  </defs>

  <g clip-path="url(#losango)">
    <rect width="500" height="500" fill="#FFFFFF" />

    <!-- Cada linha é x + y = c; a espessura 24 cobre 34 unidades de c -->
    <g stroke-width="24">
      <line x1="-323" y1="600" x2="877" y2="-600" stroke="#1F539E" />
      <line x1="-273.5" y1="600" x2="926.5" y2="-600" stroke="#282627" />
      <line x1="-224" y1="600" x2="976" y2="-600" stroke="#1F539E" />
      <line x1="-174.5" y1="600" x2="1025.5" y2="-600" stroke="#282627" />
      <line x1="-125" y1="600" x2="1075" y2="-600" stroke="#1F539E" />
    </g>

    <!-- À direita do M, azul sólido -->
    <polygon points="380,90 520,250 380,410" fill="#1F539E" />

    <!-- Abaixo do M, grafite sólido -->
    <polygon points="90,370 410,370 250,530" fill="#282627" />

    <!-- O M: as duas pernas do V a 45°, como as listras -->
    <polygon points="118,114 240,236 380,96 380,370 118,370" fill="#FFFFFF" />
  </g>
</svg>
