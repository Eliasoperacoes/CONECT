<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Clip no formato exato do losango Malachias -->
    <clipPath id="malachias-losango">
      <polygon points="250,15 485,250 250,485 15,250" />
    </clipPath>
  </defs>

  <g clip-path="url(#malachias-losango)">
    <!-- Base branca -->
    <rect width="500" height="500" fill="#FFFFFF" />

    <!-- Listras diagonais no quadrante superior-esquerdo (perpendiculares à borda noroeste) -->
    <!-- Ângulo de 45° descendo de noroeste para sudeste: dx=1, dy=1 -->
    <g stroke-linecap="butt">
      <!-- 1. Azul próximo ao topo -->
      <line x1="180" y1="-80" x2="480" y2="220" stroke="#1F539E" stroke-width="17" />
      <!-- 2. Preto -->
      <line x1="150" y1="-70" x2="450" y2="230" stroke="#282627" stroke-width="17" />
      <!-- 3. Azul -->
      <line x1="120" y1="-60" x2="420" y2="240" stroke="#1F539E" stroke-width="17" />
      <!-- 4. Preto -->
      <line x1="90" y1="-50" x2="390" y2="250" stroke="#282627" stroke-width="17" />
      <!-- 5. Azul -->
      <line x1="60" y1="-40" x2="360" y2="260" stroke="#1F539E" stroke-width="17" />
      <!-- 6. Preto -->
      <line x1="30" y1="-30" x2="330" y2="270" stroke="#282627" stroke-width="17" />
      <!-- 7. Azul -->
      <line x1="0" y1="-20" x2="300" y2="280" stroke="#1F539E" stroke-width="17" />
      <!-- 8. Preto -->
      <line x1="-30" y1="-10" x2="270" y2="290" stroke="#282627" stroke-width="17" />
      <!-- 9. Azul -->
      <line x1="-60" y1="0" x2="240" y2="300" stroke="#1F539E" stroke-width="17" />
      <!-- 10. Preto -->
      <line x1="-90" y1="10" x2="210" y2="310" stroke="#282627" stroke-width="17" />
      <!-- 11. Azul -->
      <line x1="-120" y1="20" x2="180" y2="320" stroke="#1F539E" stroke-width="17" />
      <!-- 12. Preto -->
      <line x1="-150" y1="30" x2="150" y2="330" stroke="#282627" stroke-width="17" />
      <!-- 13. Azul -->
      <line x1="-180" y1="40" x2="120" y2="340" stroke="#1F539E" stroke-width="17" />
    </g>

    <!-- Quadrante Direito: Azul Royal Sólido -->
    <polygon points="368,132 485,250 368,367" fill="#1F539E" />

    <!-- Triângulo Inferior: Preto Grafite Sólido -->
    <polygon points="125,375 370,375 250,485" fill="#282627" />

    <!-- O grande 'M' branco central estilizado da Malachias -->
    <polygon points="115,118 235,238 370,118 370,375 125,375" fill="#FFFFFF" />
  </g>
</svg>
