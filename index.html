<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!--
      NO APLICATIVO ANDROID, A PÁGINA FICA ENTRE AS BARRAS — e isto tem de
      acontecer AQUI, antes do primeiro desenho.

      `viewport-fit=cover` é para o iPhone. No aplicativo, o Capacitor lê
      esta meta UMA VEZ, no primeiro desenho (a tela de espera), e decide
      por ela quem desconta a barra de navegação. Com `cover`, quem
      desconta é o WebView; com o teclado aberto o Capacitor ainda recua
      a página pela altura do teclado, que já inclui a barra — e ela era
      descontada duas vezes. Era a faixa vazia entre a caixa de mensagem
      e o teclado, medida no S10 do Elias: 170px, a altura exata da barra.

      A troca morava no aplicativo.ts, que só roda depois de o sistema
      baixar: tarde demais, o Capacitor já tinha lido `cover`.

      `androidBridge` é a ponte que o Capacitor põe na página desde o
      primeiro instante, e só dentro do aplicativo. No navegador e no
      iPhone ela não existe, e nada muda.
    -->
    <script>
      if (window.androidBridge) {
        var metaDaTela = document.querySelector('meta[name="viewport"]');
        metaDaTela.content = metaDaTela.content.replace('viewport-fit=cover', 'viewport-fit=auto');
      }
    </script>
    <title>CONECTA — Malachias Autopeças</title>
    <meta name="description" content="Comunicador interno da Malachias Autopeças com conversas, grupos, painel de controle da rede, quadro de funcionários, fotos da câmera e rádio ao vivo." />
    <meta property="og:title" content="CONECTA — Malachias Autopeças" />
    <meta property="og:description" content="Comunicador interno da Malachias Autopeças com conversas, grupos, painel de controle da rede, quadro de funcionários, fotos da câmera e rádio ao vivo." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CONECTA" />
    <!-- A logo oficial (marca/pacote-original), nos tamanhos da aba do navegador -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="manifest" href="/manifest.json" />
    <!--
      PNG, e não SVG: o iPhone ignora SVG no ícone da tela de início e
      coloca uma miniatura da página no lugar. Era o que estava acontecendo.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/logo-malachias.svg" />
    <!--
      A TELA DE ESPERA mora aqui, e não no React.

      Ela aparece no primeiro desenho da página, antes de o pacote do
      sistema (1,8 MB) baixar. Dentro do React ela só surgia DEPOIS do
      download — e até lá o aplicativo Android mostrava a tela vazia do
      WebView, que no tema escuro do celular é preta.

      O React não a desenha de novo: quando a sessão está conferida, ele
      a retira (`encerrarEspera`, em servicos/telaDeEspera.ts). Um
      desenho só, em um lugar só.
    -->
    <style>
      #espera {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #ffffff;
        transition: opacity 0.35s ease;
      }
      #espera.saindo { opacity: 0; pointer-events: none; }

      /* O losango respira, e um brilho atravessa a marca na diagonal
         das listras. O corte em losango prende o brilho dentro dela. */
      #espera .marca {
        position: relative;
        width: 132px;
        height: 132px;
        clip-path: polygon(50% 2%, 98% 50%, 50% 98%, 2% 50%);
        animation: espera-respira 1.8s ease-in-out infinite;
      }
      #espera .marca img { width: 100%; height: 100%; display: block; }
      #espera .marca::after {
        content: '';
        position: absolute;
        inset: -50%;
        background: linear-gradient(
          135deg,
          transparent 40%,
          rgba(255, 255, 255, 0.75) 50%,
          transparent 60%
        );
        animation: espera-brilho 1.8s ease-in-out infinite;
      }
      #espera .nome {
        font: 700 13px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.32em;
        color: #1F539E;
        padding-left: 0.32em;
      }
      /* A barra corre sem fim: não há como saber quanto falta */
      #espera .barra {
        width: 120px;
        height: 3px;
        border-radius: 3px;
        background: #e5e9f2;
        overflow: hidden;
        margin-top: -14px;
      }
      #espera .barra::before {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #1F539E;
        animation: espera-barra 1.2s ease-in-out infinite;
      }
      @keyframes espera-respira {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes espera-brilho {
        from { transform: translate(-40%, -40%); }
        to { transform: translate(40%, 40%); }
      }
      @keyframes espera-barra {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #espera .marca, #espera .marca::after, #espera .barra::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="espera" role="status" aria-label="Carregando o CONECTA">
      <div class="marca"><img src="/logo-malachias.svg" alt="" /></div>
      <div class="nome">CONECTA</div>
      <div class="barra"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      O TRABALHADOR É REGISTRADO AQUI, e não dentro do React.

      Estava num `useEffect` do App — ou seja, só depois do pacote baixar,
      o React montar e o efeito correr. Três consequências:

        1. O PWABuilder analisou o site e respondeu "did not find a
           Service Worker". Ele lê a página; não espera o React.
        2. Quem abre sem sinal não chega a montar o React, então o
           trabalhador que serviria a página guardada nunca era
           registrado — justamente quando ele faz falta.
        3. Se o pacote falhar em carregar, não há offline nenhum.

      No `load` de propósito: registrar antes disputa banda com o próprio
      pacote do sistema, e a primeira abertura fica mais lenta.

      `prepararAvisos()` continua chamando `register` no React. Não é
      duplicata: com a mesma URL, o navegador devolve o registro que já
      existe — e é de lá que sai a permissão de aviso.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw-avisos.js').catch(function (erro) {
            // Sem trabalhador o sistema funciona: perde offline e aviso
            console.error('Falha ao registrar o trabalhador:', erro);
          });
        });
      }
    </script>
  </body>
</html>
